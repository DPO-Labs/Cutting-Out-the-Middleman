<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #121212;
            --bg-surface: #181818;
            --bg-elevated: #1f1f1f;
            --bg-hover: #282828;
            --spotify-green: #1ed760;
            --spotify-green-dark: #1db954;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #727272;
            --border-color: #4d4d4d;
            --shadow-medium: rgba(0,0,0,0.3) 0px 8px 8px;
            --shadow-heavy: rgba(0,0,0,0.5) 0px 8px 24px;
            --error-red: #f3727f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 344px;
            background: var(--bg-surface);
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }

        .sidebar.hidden {
            transform: translateX(-100%);
            width: 0;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 24px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--spotify-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 20px;
            height: 20px;
        }

        .close-sidebar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-sidebar:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
        }

        .nav-section {
            padding: 8px 16px;
        }

        .nav-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            opacity: 0.7;
        }

        .nav-item.active svg {
            opacity: 1;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
        }

        .header {
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 12px 24px;
            border-radius: 500px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--spotify-green);
            color: #000000;
            border: none;
        }

        .btn-primary:hover {
            background: var(--spotify-green-dark);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-elevated);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: var(--bg-hover);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--bg-elevated);
            border-radius: 4px;
        }

        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--spotify-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-heavy);
        }

        .welcome-icon svg {
            width: 40px;
            height: 40px;
            fill: #000000;
        }

        .welcome h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .welcome p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .quick-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .quick-action {
            padding: 14px 24px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: 500px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-action:hover {
            background: var(--bg-hover);
            border-color: var(--spotify-green);
            color: var(--spotify-green);
        }

        .message {
            display: flex;
            gap: 16px;
            max-width: 800px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar.ai {
            background: var(--spotify-green);
        }

        .avatar.user {
            background: var(--bg-elevated);
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: calc(100% - 56px);
        }

        .bubble {
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bubble.ai {
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-left-radius: 4px;
        }

        .bubble.user {
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.05);
            border-bottom-right-radius: 4px;
        }

        .bubble code {
            background: var(--bg-deep);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 14px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 16px 20px;
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--spotify-green);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        .input-container {
            padding: 20px 32px 28px;
            background: var(--bg-deep);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px 60px 16px 20px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            resize: none;
            min-height: 56px;
            max-height: 200px;
            line-height: 1.5;
            box-shadow: inset 0 0 0 1px rgba(124,124,124,0.3);
            transition: all 0.2s ease;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--spotify-green);
            box-shadow: inset 0 0 0 1px var(--spotify-green), 0 0 0 2px rgba(30,215,96,0.2);
        }

        .input-box::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--spotify-green);
            color: #000000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: var(--spotify-green-dark);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
        }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
        }

        .error-message {
            background: rgba(243,114,127,0.1);
            border: 1px solid var(--error-red);
            color: var(--error-red);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .header {
                padding: 16px 20px;
            }
            
            .header-title {
                font-size: 18px;
            }
            
            .chat-container {
                padding: 16px 20px;
            }
            
            .input-container {
                padding: 16px 20px 24px;
            }
            
            .welcome h1 {
                font-size: 24px;
            }
            
            .welcome p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </div>
                <span>Chat AI</span>
            </div>
            <button class="close-sidebar" onclick="toggleSidebar()" title="Close Sidebar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section">
                <div class="nav-label">Menu</div>
                <div class="nav-item active" onclick="clearChat()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>New Chat</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12,6 12,12 16,14"/>
                    </svg>
                    <span>History</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-label">Features</div>
                <div class="nav-item" onclick="sendQuickMessage('Analyze sentiment: I love this product!')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                        <line x1="9" y1="9" x2="9.01" y2="9"/>
                        <line x1="15" y1="9" x2="15.01" y2="9"/>
                    </svg>
                    <span>Sentiment Analysis</span>
                </div>
                <div class="nav-item" onclick="sendQuickMessage('Hello vs Hi there')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14,2 14,8 20,8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <span>Paraphrase Detection</span>
                </div>
            </div>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <button class="btn-icon" onclick="toggleSidebar()" title="Toggle Sidebar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <h2 class="header-title">Chat</h2>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="clearChat()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3,6 5,6 21,6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Clear
                </button>
                <button class="btn btn-primary" onclick="showWelcome()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    New Chat
                </button>
            </div>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                    </svg>
                </div>
                <h1>Your AI Assistant</h1>
                <p>I can help with sentiment analysis, paraphrase detection, and general conversation. What would you like to try?</p>
                <div class="quick-actions">
                    <button class="quick-action" onclick="sendQuickMessage('Analyze sentiment: I love this product!')">Analyze Sentiment</button>
                    <button class="quick-action" onclick="sendQuickMessage('Hello vs Hi there')">Check Paraphrase</button>
                    <button class="quick-action" onclick="sendQuickMessage('What can you help me with?')">Capabilities</button>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea class="input-box" id="messageInput" placeholder="Send a message..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22,2 15,22 11,13 2,9"/>
                    </svg>
                </button>
            </div>
            <p class="input-hint">AI can make mistakes. Please verify important information.</p>
        </div>
    </main>

    <script>
        let messages = [];
        let isTyping = false;

        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');
        const welcome = document.getElementById('welcome');

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function showWelcome() {
            welcome.style.display = 'flex';
            const msgs = chatContainer.querySelectorAll('.message, .typing');
            msgs.forEach(msg => msg.remove());
        }

        function clearChat() {
            messages = [];
            showWelcome();
        }

        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }

        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isTyping) return;

            welcome.style.display = 'none';
            messageInput.value = '';
            messageInput.style.height = 'auto';

            messages.push({ role: 'user', content });
            addMessage('user', content);

            isTyping = true;
            sendBtn.disabled = true;
            addTyping();

            try {
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: messages,
                        model: 'chat-ai'
                    })
                });

                const data = await response.json();
                removeTyping();

                const assistantMessage = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: assistantMessage });
                addMessage('assistant', assistantMessage);
            } catch (error) {
                removeTyping();
                addMessage('assistant', 'Sorry, something went wrong. Please try again.');
            }

            isTyping = false;
            sendBtn.disabled = false;
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const avatarIcon = role === 'assistant' ? 'AI' : 'U';
            
            div.innerHTML = `
                <div class="avatar ${role}">${avatarIcon}</div>
                <div class="message-content">
                    <div class="bubble ${role}">${formatMessage(content)}</div>
                    <span class="message-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                </div>
            `;
            
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatMessage(text) {
            return text.replace(/`([^`]+)`/g, '<code>$1</code>');
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <div class="avatar ai">AI</div>
                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('hidden');
        }
    </script>
</body>
</html>
